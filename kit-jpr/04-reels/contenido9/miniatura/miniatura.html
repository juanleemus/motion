<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(../../../fuentes/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(../../../fuentes/Poppins-Medium.ttf);font-weight:500}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0A1F44;font-family:P;font-weight:700}
.fondo{position:absolute;left:0;top:0;width:1080px;height:1920px;
 background:
  radial-gradient(ellipse 60% 38% at 50% 50%, rgba(47,95,255,.55), rgba(47,95,255,0) 70%),
  radial-gradient(ellipse 90% 60% at 50% 100%, rgba(47,95,255,.25), rgba(0,0,0,0) 70%),
  linear-gradient(#071533,#0A1F44 50%,#050f24)}
.grilla{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:.10;
 background-image:linear-gradient(#2F5FFF 2px,transparent 2px),linear-gradient(90deg,#2F5FFF 2px,transparent 2px);
 background-size:90px 90px;
 -webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 50%,#000 30%,transparent 80%)}
.t{position:absolute;left:0;right:0;text-align:center;text-transform:uppercase;line-height:.86;letter-spacing:-.045em}
.blanco{color:#fff}.lima{color:#C8F542}
.sombra{text-shadow:0 10px 40px rgba(0,0,0,.55)}
.arriba{top:300px}
.l1{font-size:112px}
.l2{font-size:178px}
.q{font-size:178px;color:#fff;margin-left:6px}
.raya{display:inline-block;border-bottom:16px solid #C8F542;padding-bottom:8px}
.logo{position:absolute;left:50%;top:960px;transform:translate(-50%,-50%);width:360px;height:360px;border-radius:84px;background:#fff;
 display:flex;align-items:center;justify-content:center;
 box-shadow:0 0 0 10px rgba(200,245,66,.9),0 0 120px 30px rgba(200,245,66,.35),0 40px 90px rgba(0,0,0,.6)}
.logo img{width:62%}
.banderas{position:absolute;top:1235px;left:0;right:0;display:flex;justify-content:center;gap:28px}
.banderas img{width:116px;height:87px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);object-fit:cover}
.abajo{top:1385px}
.l3{font-size:86px}
.l4{font-size:170px}
</style></head><body>
<div class="fondo"></div><div class="grilla"></div>
<div class="t arriba sombra">
 <div class="l1 blanco">¿Pauta en</div>
 <div><span class="l2 lima">ChatGPT</span><span class="q">?</span></div>
</div>
<div class="logo"><img src="../../../03-logos/openai.png"></div>
<div class="banderas">
 <img src="../../../03-logos/bandera-colombia.png"><img src="../../../03-logos/bandera-argentina.png">
 <img src="../../../03-logos/bandera-chile.png"><img src="../../../03-logos/bandera-peru.png">
</div>
<div class="t abajo sombra">
 <div class="l3 blanco">el anuncio es el</div>
 <div class="l4 lima"><span class="raya">plan B</span></div>
</div>
</body></html>
